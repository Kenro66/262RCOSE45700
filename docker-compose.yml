# Issue #4：本地开发数据库（PostgreSQL 18 + pgvector）
#
# 启动（在 repo 根目录执行，先按 README 建好 backend/.env；
# 所有 compose 命令统一携带 --env-file backend/.env）：
#   docker compose --env-file backend/.env up -d postgres
#
# 首次启动会自动执行 storage/schema.sql（挂载到 docker-entrypoint-initdb.d/）：
#   建 vector 扩展 + documents / chunks 两张表。
# 之后重启不会重复执行；要推倒重建数据库：
#   docker compose --env-file backend/.env down -v

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: p4rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置——请先在 backend/.env 里填}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ 官方映像要求掛在 /var/lib/postgresql（資料在其中的版本子目錄）
      - postgres_data:/var/lib/postgresql
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d p4rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
