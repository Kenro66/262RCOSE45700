[mypy]
# 检查整个应用，包括已有函数体；不按模块豁免业务代码。
files = app
python_version = 3.12
follow_imports = silent
check_untyped_defs = True
warn_unused_ignores = True

# 这些外部包没有可用的类型声明；只隔离第三方内部实现，不忽略 app 错误。
[mypy-torch,FlagEmbedding,FlagEmbedding.*,asyncpg,asyncpg.*]
ignore_missing_imports = True
follow_imports = skip
